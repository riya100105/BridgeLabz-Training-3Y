<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip</title>
    <link rel="stylesheet" href="solution9.css">
</head>
<body>
    <div class="card-container">
        <div class="card">
            <div class="front">
                <img src="https://picsum.photos/id/1005/400/250" alt="Nature">
                <h2>Beautiful Nature</h2>
            </div>
            <div class="back">
                <h2>About Nature</h2>
                <p>Nature provides beautiful landscapes and peaceful surroundings that inspire us.</p>
            </div>
        </div>
    </div>
</body>
</html>
