<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login Form</title>
</head>
<body>

    <h1>Login</h1>

    <!-- CSRF tokens help prevent unauthorized requests made from another website. -->
    <form>
        <label>Username:</label>
        <input type="text" name="username">
        <br><br>

        <label>Password:</label>
        <input type="password" name="password">
        <br><br>

        <input type="hidden" name="csrf_token" value="dummy12345">

        <input type="submit" value="Login">
    </form>

</body>
</html>
