<!DOCTYPE html>
<html>
<head>
    <title>Frameset Website</title>
</head>

<!-- Frameset divides the page into top and bottom sections -->
<frameset rows="30%,70%">

    <!-- Top frame contains navigation links -->
    <frame src="navigation.html">

    <!-- Bottom frame displays the welcome message -->
    <frame src="welcome.html">

</frameset>

</html>
