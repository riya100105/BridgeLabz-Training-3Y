<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map</title>
</head>
<body>
    <h1>My City on Google Maps</h1>

    <!-- loading="lazy" delays loading the map until it is close to the visible area -->
    <iframe
        src="https://www.google.com/maps?q=New+Delhi&output=embed"
        title="Google Map showing New Delhi"
        width="600"
        height="450"
        loading="lazy">
    </iframe>
</body>
</html>
