<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced CSS Selectors</title>
  <link rel="stylesheet" href="solution5.css">
</head>
<body>
  <main>
    <h1>Advanced CSS Selectors</h1>
    <section class="content">
      <ul>
        <li>First item</li><li>Second item</li><li>Third item</li><li>Fourth item</li>
      </ul>
      <form>
        <input type="text" placeholder="Text input">
        <input type="email" placeholder="Email input">
      </form>
      <p>Visit our <a href="https://example.com">secure website</a>.</p>
      <div class="group"><span>Direct child</span><div><span>Nested descendant</span></div><span>Another sibling</span></div>
    </section>
  </main>
</body>
</html>
