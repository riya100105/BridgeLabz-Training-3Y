<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borders and Padding</title>
  <link rel="stylesheet" href="solution1.css">
</head>
<body>
  <header><h1>Borders and Padding</h1></header>
  <main>
    <section class="box-container">
      <div class="demo solid">Solid Border<br><small>Padding: 20px</small></div>
      <div class="demo dashed">Dashed Border<br><small>Padding: 30px</small></div>
      <div class="demo double">Double Border<br><small>Padding: 15px</small></div>
      <div class="demo groove">Groove Border<br><small>Padding: 25px</small></div>
      <div class="demo rounded">Rounded Corners<br><small>border-radius: 25px</small></div>
    </section>
  </main>
  <footer>Hover over a box to see the border transition.</footer>
</body>
</html>
