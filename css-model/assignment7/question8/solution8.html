<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Model Exploration</title>
  <link rel="stylesheet" href="solution8.css">
</head>
<body>
  <main>
    <h1>CSS Box Model</h1>
    <section class="demo">
      <div class="margin-layer">
        <span class="label margin-label">MARGIN</span>
        <div class="border-layer">
          <span class="label border-label">BORDER</span>
          <div class="padding-layer">
            <span class="label padding-label">PADDING</span>
            <div class="content-layer">CONTENT</div>
          </div>
        </div>
      </div>
    </section>
    <section class="comparison">
      <div><h2>Default box sizing</h2><p>Content width and padding/border are added together.</p></div>
      <div class="border-box"><h2>border-box</h2><p>Padding and border are included in the declared size.</p></div>
    </section>
  </main>
</body>
</html>
