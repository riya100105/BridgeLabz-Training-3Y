<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Character Counter - Assignment 7</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/q2.js" defer></script>
</head>
<body>
  <header class="page-header">
    <a href="index.html">← Back to all questions</a>
    <h1>Live Character Counter</h1>
    <p>Maximum 100 characters with warning colors and a reset button.</p>
  </header>
  <main class="demo">

  <h2>Write something</h2>
  <textarea id="message" rows="6" maxlength="100" placeholder="Type up to 100 characters..."></textarea>
  <p id="counter" class="counter">100 characters remaining</p>
  <button id="resetButton" class="secondary" type="button">Reset</button>

  </main>
</body>
</html>
