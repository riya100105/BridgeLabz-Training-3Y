<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Step Form - Assignment 7</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/q3.js" defer></script>
</head>
<body>
  <header class="page-header">
    <a href="index.html">← Back to all questions</a>
    <h1>Multi-Step Form</h1>
    <p>Complete all three steps to view your summary.</p>
  </header>
  <main class="demo">

  <p id="stepIndicator" class="step-indicator">Step 1 of 3</p>
  <form id="multiStepForm">
    <section class="form-step" data-step="0">
      <label for="fullName">Name</label>
      <input id="fullName" type="text" placeholder="Enter your name" required>
      <p class="error" id="nameError"></p>
    </section>
    <section class="form-step" data-step="1" hidden>
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="name@example.com" required>
      <p class="error" id="emailError"></p>
    </section>
    <section class="form-step" data-step="2" hidden>
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="At least 6 characters" required>
      <p class="error" id="passwordError"></p>
    </section>
    <div class="actions">
      <button id="backButton" class="secondary" type="button" hidden>Back</button>
      <button id="nextButton" type="button">Next</button>
    </div>
  </form>
  <section id="summary" hidden>
    <h2 class="success">All steps completed!</h2>
    <p id="summaryText"></p>
    <button id="restartButton" class="secondary" type="button">Start Again</button>
  </section>

  </main>
</body>
</html>
