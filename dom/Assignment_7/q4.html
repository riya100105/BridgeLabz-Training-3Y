<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Switcher - Assignment 7</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/q4.js" defer></script>
</head>
<body>
  <header class="page-header">
    <a href="index.html">← Back to all questions</a>
    <h1>Theme Switcher</h1>
    <p>Choose a theme. The selected theme is stored in the data-theme attribute.</p>
  </header>
  <main class="demo">

  <h2>Choose a theme</h2>
  <div class="actions">
    <button type="button" data-theme-choice="light">Light</button>
    <button type="button" data-theme-choice="dark">Dark</button>
    <button type="button" data-theme-choice="blue">Blue</button>
  </div>
  <p id="themeStatus" class="helper">Current theme: Light</p>

  </main>
</body>
</html>
