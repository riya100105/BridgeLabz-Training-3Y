<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery with Modal Preview - Assignment 7</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/q5.js" defer></script>
</head>
<body>
  <header class="page-header">
    <a href="index.html">← Back to all questions</a>
    <h1>Image Gallery with Modal Preview</h1>
    <p>Click any image to view a larger version. Click outside the image to close.</p>
  </header>
  <main class="demo">

  <div class="gallery" id="gallery">
    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=500" alt="Mountain landscape">
    <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=500" alt="Lake and mountains">
    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500" alt="Forest">
    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500" alt="Beach">
    <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=500" alt="Sunrise">
    <img src="https://images.unsplash.com/photo-1511497584788-876760111969?w=500" alt="Green trees">
  </div>
  <div id="imageModal" class="modal">
    <div class="modal-content" id="modalContent">
      <img id="largeImage" src="" alt="Large preview">
    </div>
  </div>

  </main>
</body>
</html>
